<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
    <style>#hero {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  color: #fff;
  position: relative;
  width: 100%;
  height: 50%;
}

#hero img {
  position: absolute;
  z-index: -2;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#hero::before {
  content: "";
  z-index: -1;
  position: absolute;
  font-size: 50px;
  width: 100%;
  height: 100%;
  background-color: blueviolet;
  opacity: 0.8;
}

#hero h1 {
  display: flex;
  align-items: center;
}

#hero h1::before {
  margin-right: 10px;
}

#hero h1::after {
  margin-left: 10px;
}

#hero h1::before, #hero h1::after {
  content: "";
  border-top: 2px solid #fff;
  width: 50px;
  display: block;
}</style>

  <section id="hero">

    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSinXszO_F7HsXj5l_2jSHBfq4jwm0mKCrhVNxJu7tVg4m7cAx8GVSjqkeM&s=10">
    
    <h1>
      Texto 1
    </h1>
    <h2>Texto 2</h2>
    <h3>Texto 3</h3>

  </section>
</body>
</html>
